<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>약국 근무표·연차 관리</title>
<style>
:root{--bg:#f3f5f5;--card:#fff;--text:#2b3a3a;--line:#e3e8e8;--main:#22c997;--main-d:#16a37a;--red:#ff6b6b;--blue:#4a90e2;--mute:#8a9696}
@media (prefers-color-scheme:dark){:root{--bg:#1c2222;--card:#263030;--text:#e6eeee;--line:#3a4848;--mute:#9bb0b0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:1250px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:1.9rem}
.tabs{display:flex;gap:6px}
.tab{padding:9px 18px;border:0;border-radius:10px;background:var(--card);color:var(--text);font-weight:700;cursor:pointer;font-size:.95rem}
.tab.on{background:var(--main);color:#fff}
button{font-family:inherit}
.btn{border:0;border-radius:8px;padding:9px 16px;background:var(--main);color:#fff;font-weight:700;cursor:pointer;font-size:.9rem}
.btn:hover{background:var(--main-d)}
.btn.sub{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.layout{display:grid;grid-template-columns:1fr 280px;gap:22px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mhead h2{margin:0;font-size:1.7rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.dow{padding:10px 0;text-align:center;font-weight:700;background:rgba(128,150,150,.08)}
.day{min-height:112px;padding:6px 5px;cursor:pointer}
.day:hover{background:rgba(34,201,151,.07)}
.day.empty{background:rgba(128,150,150,.05);cursor:default}
.day.today .dn{background:var(--main);color:#fff;border-radius:50%;display:inline-block;width:24px;height:24px;text-align:center;line-height:24px}
.dn{font-size:.85rem;margin-bottom:3px}
.sun{color:var(--red)}.sat{color:var(--blue)}
.chip{font-size:.72rem;color:#fff;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;text-shadow:0 0 2px rgba(0,0,0,.25)}
.chip.dim{opacity:.18}
.chip.off{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 4px,transparent 4px 8px)}
.side h3{margin:16px 0 10px}
.staff{display:block;width:100%;border:3px solid transparent;border-radius:10px;padding:13px;margin-bottom:9px;color:#fff;font-weight:800;font-size:1rem;cursor:pointer;text-shadow:0 0 3px rgba(0,0,0,.25)}
.staff.sel{border-color:var(--text)}
.hint{color:var(--mute);font-size:.8rem;margin:4px 0 10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:16px;padding:26px;width:100%;max-width:520px;max-height:92vh;overflow:auto;position:relative}
.modal.wide{max-width:860px}
.modal h3{margin:0 0 16px;font-size:1.3rem}
.x{position:absolute;right:16px;top:12px;border:0;background:none;font-size:1.8rem;color:var(--mute);cursor:pointer}
label{display:block;font-size:.82rem;font-weight:700;margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:.95rem;font-family:inherit}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.row.n>*{flex:none}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:rgba(128,150,150,.1);padding:9px 6px}
td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.sumbox{background:rgba(128,150,150,.08);border-radius:10px;padding:14px;margin-top:14px;line-height:1.8}
.total{color:var(--blue);font-weight:800;text-align:right;font-size:1.05rem}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.gc{border-radius:14px;padding:16px;color:#fff;cursor:pointer;border:3px solid transparent;text-shadow:0 0 3px rgba(0,0,0,.25)}
.gc.sel{border-color:var(--text)}
.gc b{font-size:1.1rem}
.gc .big{font-size:1.9rem;font-weight:800;margin:6px 0 2px}
.gc small{display:block;opacity:.95}
.bar{height:7px;background:rgba(255,255,255,.35);border-radius:5px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff}
.srow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow input[type=text]{flex:1}
.srow input[type=color]{width:42px;padding:2px;height:38px;flex:none}
.srow input[type=number]{width:90px;flex:none}
.neg{color:var(--red);font-weight:700}.pos{color:var(--main-d);font-weight:700}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:700;color:#fff}
.hide{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;z-index:99;display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 id="title">약국 근무 스케줄 🗓️</h1>
  <div class="row n">
    <div class="tabs">
      <button class="tab on" data-tab="pharm">약사 근무표</button>
      <button class="tab" data-tab="staff">직원 근무표</button>
      <button class="tab" data-tab="leave">연차</button>
    </div>
    <button class="btn sub" id="btnAuth">🔒 관리자 로그인</button>
    <button class="btn sub admin" id="btnSet">⚙️ 환경설정</button>
  </div>
</header>
<div class="card admin hide" id="pubBar" style="margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between">
  <span id="pubMsg"></span>
  <button class="btn" id="btnPub">📤 공유용 data.json 내려받기</button>
</div>

<!-- 근무표 -->
<section id="v-sched" class="layout" data-view>
  <div class="card">
    <div class="mhead">
      <button class="btn" id="prev">&lt; 이전 달</button>
      <h2 id="mtitle"></h2>
      <button class="btn" id="next">다음 달 &gt;</button>
    </div>
    <div class="cal" id="cal"></div>
  </div>
  <div class="card side">
    <button class="btn" style="width:100%" id="btnStats">📊 통계 보기</button>
    <h3>직원 명단</h3>
    <div class="hint">직원을 누르면 그 직원 근무만 강조돼요.</div>
    <div id="staffList"></div>
  </div>
</section>

<!-- 연차 -->
<section id="v-leave" class="hide">
  <div class="card">
    <div class="mhead">
      <h2 style="font-size:1.4rem">연차 현황</h2>
      <div class="row n">
        <button class="btn sub sm" id="lyPrev">◀</button>
        <b id="lyear" style="font-size:1.2rem"></b>
        <button class="btn sub sm" id="lyNext">▶</button>
      </div>
    </div>
    <div class="gcards" id="gcards"></div>
    <div class="mhead">
      <h3 style="margin:0" id="lhTitle">사용·지급 내역</h3>
      <div class="row n admin">
        <button class="btn" id="btnUse">+ 연차 사용 등록</button>
        <button class="btn sub" id="btnGrant">+ 연차 지급/조정</button>
      </div>
    </div>
    <table>
      <thead><tr><th>날짜</th><th>구분</th><th>시간</th><th>비고</th><th>잔여(누적)</th><th class="admin"></th></tr></thead>
      <tbody id="lbody"></tbody>
    </table>
    <div class="hint" style="margin-top:12px">시간 단위로 관리합니다. (1일 = 환경설정의 '1일 시간', 기본 8시간)</div>
  </div>
</section>
</div>

<!-- 근무 등록 모달 -->
<div class="overlay" id="mShift"><div class="modal">
  <button class="x" data-close>×</button>
  <h3 id="shiftTitle">근무 등록</h3>
  <label>직원</label><select id="sStaff"></select>
  <label>근무 형태</label>
  <select id="sType"><option>주간</option><option>마감</option><option>휴가</option><option>휴무</option></select>
  <div class="row" id="sTimes">
    <div><label>출근</label><input type="time" id="sStart" value="09:00"></div>
    <div><label>퇴근</label><input type="time" id="sEnd" value="18:00"></div>
  </div>
  <label>비고</label><input type="text" id="sNote">
  <div id="shiftExisting"></div>
  <div class="row" style="margin-top:18px">
    <button class="btn" id="sSave">저장</button>
    <button class="btn danger hide" id="sDel">삭제</button>
  </div>
</div></div>

<!-- 통계 -->
<div class="overlay" id="mStats"><div class="modal wide">
  <button class="x" data-close>×</button>
  <h3>월간 근무 통계 📈</h3>
  <div class="row"><div style="flex:none"><label style="display:inline">직원 선택:</label> <select id="stStaff" style="width:auto"></select></div><div style="text-align:right;font-weight:700" id="stMonth"></div></div>
  <table style="margin-top:12px"><thead><tr><th>날짜</th><th>요일</th><th>근무형태</th><th>출근</th><th>퇴근</th><th>근무시간(H)</th><th>비고</th></tr></thead><tbody id="stBody"></tbody></table>
  <div class="sumbox" id="stSum"></div>
</div></div>

<!-- 연차 사용 -->
<div class="overlay" id="mUse"><div class="modal">
  <button class="x" data-close>×</button>
  <h3>연차 사용 등록</h3>
  <label>직원</label><select id="uStaff"></select>
  <label>사용 날짜</label><input type="date" id="uDate">
  <label>사용 시간</label>
  <div class="row"><input type="number" id="uHours" step="0.5" min="0.5" value="8">
    <button class="btn sub" type="button" data-h="8">하루</button>
    <button class="btn sub" type="button" data-h="4">반차</button>
    <button class="btn sub" type="button" data-h="2">2시간</button></div>
  <label>비고</label><input type="text" id="uNote" placeholder="예) 개인 사유, 병원">
  <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="uSync" checked style="width:auto"> 근무표에 '휴가'로도 표시</label>
  <button class="btn" style="margin-top:18px;width:100%" id="uSave">저장</button>
</div></div>

<!-- 연차 지급 -->
<div class="overlay" id="mGrant"><div class="modal">
  <button class="x" data-close>×</button>
  <h3>연차 지급 / 조정</h3>
  <label>직원</label><select id="gStaff"></select>
  <label>지급 날짜</label><input type="date" id="gDate">
  <label>시간 (차감은 마이너스 입력)</label>
  <div class="row"><input type="number" id="gHours" step="0.5" value="120">
  <button class="btn sub" type="button" id="g15">15일</button></div>
  <label>비고</label><input type="text" id="gNote" placeholder="예) 2027년 연차 발생">
  <button class="btn" style="margin-top:18px;width:100%" id="gSave">저장</button>
</div></div>

<!-- 환경설정 -->
<div class="overlay" id="mSet"><div class="modal">
  <button class="x" data-close>×</button>
  <h3>⚙️ 환경설정</h3>
  <label>약국 이름</label><input type="text" id="cName">
  <label>1일 근무 시간 (연차 일수 환산용)</label><input type="number" id="cDay" step="0.5" min="1">
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
  <h3 style="font-size:1.1rem">직원 관리</h3>
  <div id="cStaff"></div>
  <div class="srow"><input type="color" id="nColor" value="#4a90e2"><input type="text" id="nName" placeholder="새 이름"><select id="nGroup" style="width:90px"><option value="pharm">약사</option><option value="staff">직원</option></select><button class="btn sm" id="nAdd">추가</button></div>
  <button class="btn" style="width:100%;margin-top:16px" id="cSave">설정 저장하기</button>
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
  <h3 style="font-size:1.1rem">데이터 백업</h3>
  <div class="hint">수정한 내용은 이 브라우저에 임시 저장돼요. 직원들에게 보이려면 data.json을 내려받아 GitHub에 올리세요.</div>
  <div class="row"><button class="btn sub" id="bExp">내보내기(.json)</button><button class="btn sub" id="bImp">불러오기</button><button class="btn sub" id="bPub">게시본으로 되돌리기</button></div>
  <input type="file" id="bFile" accept=".json" class="hide">
</div></div>

<!-- 로그인 -->
<div class="overlay" id="mAuth"><div class="modal" style="max-width:380px;text-align:center">
  <button class="x" data-close>×</button>
  <h3>🔒 관리자 인증</h3>
  <input type="password" id="aPw" placeholder="비밀번호 입력" style="text-align:center;font-size:1.1rem">
  <button class="btn" style="margin-top:14px" id="aOk">확인</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='pharmacy_schedule_v1';
const COLORS=['#fcc95a','#2ecc71','#2f86e0','#ff6b6b','#00d4d4','#bbdf5a','#fca5f1'];
const DOW=['일','월','화','수','목','금','토'];
const uid=()=>Math.random().toString(36).slice(2,10);
/* 관리자 비밀번호. 화면 잠금용이며, 진짜 수정 차단은 "data.json은 나만 GitHub에 올릴 수 있다"는 점으로 보장됩니다. */
const ADMIN_PW='0810';
const def=()=>({name:'토마토약국',dayHours:8,
  staff:[['약사1','pharm'],['약사2','pharm'],['직원1','staff'],['직원2','staff'],['직원3','staff']].map((n,i)=>({id:uid(),name:n[0],group:n[1],color:COLORS[i]})),
  shifts:[],grants:[],leaves:[]});
let D, PUB=null, LOCAL=null, grp='pharm';
try{LOCAL=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const clone=o=>JSON.parse(JSON.stringify(o));
const gOf=s=>s.group||'staff';
const gs=()=>D.staff.filter(s=>gOf(s)===grp);
const GNAME={pharm:'약사',staff:'직원'};
function pick(){ D=admin?(LOCAL||(PUB&&clone(PUB))||def()):(PUB||LOCAL||def()); }
const save=()=>{LOCAL=D;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('임시 저장 실패: 브라우저 저장공간을 확인하세요')};pubBar()};
const pubData=()=>{const o=clone(D);delete o.pw;return o};
function pubBar(){
  const dirty=admin&&LOCAL&&(!PUB||JSON.stringify(pubData())!==JSON.stringify(PUB));
  $('#pubBar').classList.toggle('hide',!dirty);
  $('#pubMsg').innerHTML='⚠️ <b>아직 직원들에게 공유되지 않은 변경사항이 있어요.</b> 내려받은 data.json을 GitHub에 올려야 반영돼요.';
}
$('#btnPub').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pubData())],{type:'application/json'}));a.download='data.json';a.click()};
let admin=false, cur=new Date(); cur.setDate(1);
let selStaff=null, editShift=null, shiftDate=null, leaveYear=new Date().getFullYear(), leaveStaff=null;

const pad=n=>String(n).padStart(2,'0');
const ymd=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const todayStr=(()=>{const t=new Date();return ymd(t.getFullYear(),t.getMonth(),t.getDate())})();
const staffOf=id=>D.staff.find(s=>s.id===id);
const hoursOf=s=>{if(s.type==='휴가'||s.type==='휴무')return 0;const[a,b]=[s.start,s.end].map(t=>{const[h,m]=t.split(':').map(Number);return h*60+m});return Math.max(0,(b-a)/60)};
const fmt=n=>Math.round(n*100)/100;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
const open=id=>$(id).classList.add('on'), close=id=>$(id).classList.remove('on');
$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('on'));
$$('.overlay').forEach(o=>o.addEventListener('mousedown',e=>{if(e.target===o)o.classList.remove('on')}));

function needAdmin(){ if(admin)return true; $('#aPw').value='';open('#mAuth');setTimeout(()=>$('#aPw').focus(),50);return false }
function applyAdmin(){
  pick();
  $('#btnAuth').textContent=admin?'🔓 로그아웃':'🔒 관리자 로그인';
  $$('.admin').forEach(e=>e.classList.toggle('hide',!admin));
  pubBar();init();
}
$('#btnAuth').onclick=()=>{ if(admin){admin=false;applyAdmin();toast('로그아웃 되었습니다')} else needAdmin() };
$('#aOk').onclick=()=>{ if($('#aPw').value===ADMIN_PW){admin=true;close('#mAuth');applyAdmin();toast('관리자 모드')} else toast('비밀번호가 틀렸어요') };
$('#aPw').onkeydown=e=>{if(e.key==='Enter')$('#aOk').click()};

$$('.tab').forEach(t=>t.onclick=()=>{
  $$('.tab').forEach(x=>x.classList.toggle('on',x===t));
  const lv=t.dataset.tab==='leave';
  if(!lv){grp=t.dataset.tab;selStaff=null}
  $('#v-sched').classList.toggle('hide',lv);
  $('#v-leave').classList.toggle('hide',!lv);
  if(lv)renderLeave();else{setTitle();renderStaff();renderCal()}
});
const setTitle=()=>{$('#title').textContent=`${D.name} ${GNAME[grp]} 근무 스케줄 🗓️`;document.title=`${D.name} 근무표·연차`};

/* ---------- 근무표 ---------- */
function renderStaff(){
  $('#staffList').innerHTML=gs().map(s=>`<button class="staff ${selStaff===s.id?'sel':''}" style="background:${s.color}" data-id="${s.id}">${esc(s.name)}</button>`).join('');
  $$('#staffList .staff').forEach(b=>b.onclick=()=>{selStaff=selStaff===b.dataset.id?null:b.dataset.id;renderStaff();renderCal()});
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderCal(){
  const y=cur.getFullYear(),m=cur.getMonth();
  $('#mtitle').textContent=`${y}년 ${m+1}월`;
  const first=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate();
  let h=DOW.map((d,i)=>`<div class="dow ${i==0?'sun':i==6?'sat':''}">${d}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div class="day empty"></div>';
  for(let d=1;d<=last;d++){
    const ds=ymd(y,m,d), w=(first+d-1)%7;
    const list=D.shifts.filter(s=>s.date===ds&&staffOf(s.staffId)&&gOf(staffOf(s.staffId))===grp).sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'));
    h+=`<div class="day ${ds===todayStr?'today':''}" data-d="${ds}"><div class="dn ${w==0?'sun':w==6?'sat':''}">${d}</div>`+
    list.map(s=>{const st=staffOf(s.staffId);if(!st)return'';
      const off=s.type==='휴가'||s.type==='휴무';
      const txt=off?`${st.name} (${s.type})`:`${st.name} (${s.start}~${s.end})`;
      return `<div class="chip ${off?'off':''} ${selStaff&&selStaff!==s.staffId?'dim':''}" style="background:${st.color}" data-sid="${s.id}" title="${esc(s.note||'')}">${esc(txt)}</div>`}).join('')+'</div>';
  }
  $('#cal').innerHTML=h;
  $$('#cal .day[data-d]').forEach(c=>c.onclick=e=>{
    const chip=e.target.closest('.chip');
    if(!needAdmin())return;
    openShift(c.dataset.d,chip?chip.dataset.sid:null);
  });
}
$('#prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);renderCal()};
$('#next').onclick=()=>{cur.setMonth(cur.getMonth()+1);renderCal()};

function staffOptions(sel,val,list=D.staff){sel.innerHTML=list.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');if(val)sel.value=val}
const PRESET={주간:['09:00','18:00'],마감:['13:00','20:30']};
function openShift(date,sid){
  shiftDate=date; editShift=sid?D.shifts.find(s=>s.id===sid):null;
  staffOptions($('#sStaff'),editShift?editShift.staffId:selStaff,gs());
  $('#shiftTitle').textContent=`${date} ${editShift?'근무 수정':'근무 등록'}`;
  const s=editShift||{type:'주간',start:'09:00',end:'18:00',note:''};
  $('#sType').value=s.type;$('#sStart').value=s.start||'09:00';$('#sEnd').value=s.end||'18:00';$('#sNote').value=s.note||'';
  $('#sDel').classList.toggle('hide',!editShift);
  toggleTimes();
  const ex=D.shifts.filter(x=>x.date===date&&staffOf(x.staffId)&&gOf(staffOf(x.staffId))===grp);
  $('#shiftExisting').innerHTML=ex.length?`<div class="hint" style="margin-top:12px">이 날 근무: ${ex.map(x=>`<a href="#" data-e="${x.id}">${esc(staffOf(x.staffId)?.name)}(${x.type})</a>`).join(', ')} — 눌러서 수정</div>`:'';
  $$('#shiftExisting a').forEach(a=>a.onclick=e=>{e.preventDefault();openShift(date,a.dataset.e)});
  open('#mShift');
}
function toggleTimes(){const off=['휴가','휴무'].includes($('#sType').value);$('#sTimes').classList.toggle('hide',off)}
$('#sType').onchange=()=>{const p=PRESET[$('#sType').value];if(p&&!editShift){$('#sStart').value=p[0];$('#sEnd').value=p[1]}toggleTimes()};
$('#sSave').onclick=()=>{
  const o={staffId:$('#sStaff').value,date:shiftDate,type:$('#sType').value,start:$('#sStart').value,end:$('#sEnd').value,note:$('#sNote').value.trim()};
  if(!o.staffId)return toast('직원을 먼저 등록하세요');
  if(!['휴가','휴무'].includes(o.type)&&(!o.start||!o.end||o.end<=o.start))return toast('출근/퇴근 시간을 확인하세요');
  if(editShift)Object.assign(editShift,o);else D.shifts.push({id:uid(),...o});
  save();close('#mShift');renderCal();toast('저장됨');
};
$('#sDel').onclick=()=>{
  if(!confirm('이 근무를 삭제할까요?'))return;
  D.shifts=D.shifts.filter(s=>s.id!==editShift.id);
  D.leaves.forEach(l=>{if(l.shiftId===editShift.id)l.shiftId=null});
  save();close('#mShift');renderCal();
};

/* ---------- 통계 ---------- */
$('#btnStats').onclick=()=>{staffOptions($('#stStaff'),selStaff,gs());renderStats();open('#mStats')};
$('#stStaff').onchange=renderStats;
function renderStats(){
  const y=cur.getFullYear(),m=cur.getMonth(),sid=$('#stStaff').value;
  $('#stMonth').textContent=`${y}년 ${m+1}월 통계`;
  const pre=`${y}-${pad(m+1)}-`;
  const list=D.shifts.filter(s=>s.staffId===sid&&s.date.startsWith(pre)).sort((a,b)=>a.date.localeCompare(b.date));
  const tot={주간:0,마감:0,휴가:0,휴무:0};let hrs=0;
  $('#stBody').innerHTML=list.map(s=>{
    const h=hoursOf(s),off=h===0&&['휴가','휴무'].includes(s.type);
    if(off)tot[s.type]++;else{tot[s.type]+=h;hrs+=h}
    const dw=new Date(s.date).getDay();
    return `<tr><td>${s.date.slice(5)}</td><td class="${dw==0?'sun':dw==6?'sat':''}">${DOW[dw]}</td><td>${s.type}</td><td>${off?'-':s.start}</td><td>${off?'-':s.end}</td><td><b>${off?'-':fmt(h)}</b></td><td>${esc(s.note||'')}</td></tr>`}).join('')||'<tr><td colspan="7" style="color:var(--mute);padding:20px">이 달 근무 기록이 없어요</td></tr>';
  const nm=staffOf(sid)?.name||'';
  $('#stSum').innerHTML=`<b>📝 ${esc(nm)}님 근무 형태별 합계</b><br>주간: <b>${fmt(tot.주간)}</b> 시간 &nbsp; 마감: <b>${fmt(tot.마감)}</b> 시간 &nbsp; 휴가: <b>${tot.휴가}</b> 일 &nbsp; 휴무: <b>${tot.휴무}</b> 일<div class="total">총 근무시간(휴가/휴무 제외): ${fmt(hrs)} 시간</div>`;
}

/* ---------- 연차 ---------- */
const inYear=(d,y)=>d.startsWith(y+'-');
const dayTxt=h=>{const dh=D.dayHours||8;const d=h/dh;return `${fmt(h)}시간 (${fmt(d)}일)`};
function balance(sid,y){
  const g=D.grants.filter(x=>x.staffId===sid&&inYear(x.date,y)).reduce((a,b)=>a+b.hours,0);
  const u=D.leaves.filter(x=>x.staffId===sid&&inYear(x.date,y)).reduce((a,b)=>a+b.hours,0);
  return{g,u,r:g-u};
}
function renderLeave(){
  $('#lyear').textContent=leaveYear+'년';
  if(!D.staff.find(s=>s.id===leaveStaff))leaveStaff=D.staff[0]?.id||null;
  $('#gcards').innerHTML=D.staff.map(s=>{const b=balance(s.id,leaveYear);const pct=b.g>0?Math.max(0,Math.min(100,b.r/b.g*100)):0;
    return `<div class="gc ${leaveStaff===s.id?'sel':''}" style="background:${s.color}" data-id="${s.id}"><b>${esc(s.name)}</b> <small style="display:inline">(${GNAME[gOf(s)]})</small><div class="big">${fmt(b.r)}시간</div><small>남은 연차 (${fmt(b.r/D.dayHours)}일)</small><small>지급 ${fmt(b.g)}h · 사용 ${fmt(b.u)}h</small><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')||'<div class="hint">환경설정에서 직원을 추가하세요.</div>';
  $$('#gcards .gc').forEach(c=>c.onclick=()=>{leaveStaff=c.dataset.id;renderLeave()});
  const st=staffOf(leaveStaff);
  $('#lhTitle').textContent=st?`${st.name}님 사용·지급 내역`:'내역';
  const rows=[
    ...D.grants.filter(x=>x.staffId===leaveStaff&&inYear(x.date,leaveYear)).map(x=>({...x,kind:'g',delta:x.hours})),
    ...D.leaves.filter(x=>x.staffId===leaveStaff&&inYear(x.date,leaveYear)).map(x=>({...x,kind:'u',delta:-x.hours}))
  ].sort((a,b)=>a.date.localeCompare(b.date)||(a.kind==='g'?-1:1));
  let run=0;
  $('#lbody').innerHTML=rows.map(r=>{run+=r.delta;
    return `<tr><td>${r.date}</td><td><span class="pill" style="background:${r.kind==='g'?'var(--main-d)':'var(--red)'}">${r.kind==='g'?'지급':'사용'}</span></td><td class="${r.delta<0?'neg':'pos'}">${r.delta>0?'+':''}${fmt(r.delta)}h <small style="color:var(--mute)">(${fmt(r.delta/D.dayHours)}일)</small></td><td>${esc(r.note||'')}</td><td><b>${fmt(run)}h</b></td><td class="admin ${admin?'':'hide'}"><button class="btn danger sm" data-k="${r.kind}" data-id="${r.id}">삭제</button></td></tr>`}).join('')||'<tr><td colspan="6" style="color:var(--mute);padding:24px">내역이 없어요</td></tr>';
  $$('#lbody button').forEach(b=>b.onclick=()=>{
    if(!confirm('삭제할까요?'))return;
    if(b.dataset.k==='g')D.grants=D.grants.filter(x=>x.id!==b.dataset.id);
    else{const l=D.leaves.find(x=>x.id===b.dataset.id);if(l?.shiftId)D.shifts=D.shifts.filter(s=>s.id!==l.shiftId);D.leaves=D.leaves.filter(x=>x.id!==b.dataset.id)}
    save();renderLeave();renderCal();
  });
  $$('.admin').forEach(e=>e.classList.toggle('hide',!admin));
}
$('#lyPrev').onclick=()=>{leaveYear--;renderLeave()};
$('#lyNext').onclick=()=>{leaveYear++;renderLeave()};

$('#btnUse').onclick=()=>{if(!needAdmin())return;staffOptions($('#uStaff'),leaveStaff);$('#uDate').value=todayStr;$('#uHours').value=D.dayHours;$('#uNote').value='';open('#mUse')};
$$('[data-h]').forEach(b=>b.onclick=()=>{$('#uHours').value=b.dataset.h==='8'?D.dayHours:b.dataset.h==='4'?D.dayHours/2:b.dataset.h});
$('#uSave').onclick=()=>{
  const h=parseFloat($('#uHours').value),date=$('#uDate').value,sid=$('#uStaff').value;
  if(!sid||!date||!(h>0))return toast('날짜와 시간을 확인하세요');
  const l={id:uid(),staffId:sid,date,hours:h,note:$('#uNote').value.trim(),shiftId:null};
  if($('#uSync').checked){const sh={id:uid(),staffId:sid,date,type:'휴가',start:'',end:'',note:'연차 '+fmt(h)+'h'};D.shifts.push(sh);l.shiftId=sh.id}
  D.leaves.push(l);leaveStaff=sid;leaveYear=+date.slice(0,4);
  save();close('#mUse');renderLeave();renderCal();toast('연차 사용이 등록됐어요');
};
$('#btnGrant').onclick=()=>{if(!needAdmin())return;staffOptions($('#gStaff'),leaveStaff);$('#gDate').value=`${leaveYear}-01-01`;$('#gHours').value=D.dayHours*15;$('#gNote').value='';open('#mGrant')};
$('#g15').onclick=()=>$('#gHours').value=D.dayHours*15;
$('#gSave').onclick=()=>{
  const h=parseFloat($('#gHours').value),date=$('#gDate').value,sid=$('#gStaff').value;
  if(!sid||!date||!h)return toast('날짜와 시간을 확인하세요');
  D.grants.push({id:uid(),staffId:sid,date,hours:h,note:$('#gNote').value.trim()});
  leaveStaff=sid;leaveYear=+date.slice(0,4);save();close('#mGrant');renderLeave();toast('저장됨');
};

/* ---------- 환경설정 ---------- */
let tmpStaff=[];
$('#btnSet').onclick=()=>{
  if(!needAdmin())return;
  $('#cName').value=D.name;$('#cDay').value=D.dayHours;$('#nGroup').value=grp;
  tmpStaff=D.staff.map(s=>({...s}));renderCStaff();open('#mSet');
};
function renderCStaff(){
  $('#cStaff').innerHTML=tmpStaff.map((s,i)=>`<div class="srow"><input type="color" value="${s.color}" data-i="${i}" data-f="color"><input type="text" value="${esc(s.name)}" data-i="${i}" data-f="name"><select style="width:90px" data-i="${i}" data-f="group"><option value="pharm" ${gOf(s)==='pharm'?'selected':''}>약사</option><option value="staff" ${gOf(s)==='staff'?'selected':''}>직원</option></select><button class="btn danger sm" data-del="${i}">삭제</button></div>`).join('');
  $$('#cStaff input,#cStaff select').forEach(el=>el.oninput=()=>tmpStaff[el.dataset.i][el.dataset.f]=el.value);
  $$('#cStaff [data-del]').forEach(b=>b.onclick=()=>{
    const s=tmpStaff[b.dataset.del];
    if(!confirm(`${s.name}님을 삭제하면 이 직원의 근무·연차 기록도 모두 삭제됩니다. 계속할까요?`))return;
    tmpStaff.splice(b.dataset.del,1);renderCStaff();
  });
}
$('#nAdd').onclick=()=>{const n=$('#nName').value.trim();if(!n)return;tmpStaff.push({id:uid(),name:n,color:$('#nColor').value,group:$('#nGroup').value});$('#nName').value='';renderCStaff()};
$('#cSave').onclick=()=>{
  D.name=$('#cName').value.trim()||'토마토약국';D.dayHours=parseFloat($('#cDay').value)||8;
  const keep=new Set(tmpStaff.map(s=>s.id));
  D.shifts=D.shifts.filter(x=>keep.has(x.staffId));D.grants=D.grants.filter(x=>keep.has(x.staffId));D.leaves=D.leaves.filter(x=>keep.has(x.staffId));
  D.staff=tmpStaff.filter(s=>s.name.trim());
  save();close('#mSet');init();toast('설정이 저장됐어요');
};
$('#bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pubData(),null,1)],{type:'application/json'}));a.download=`약국근무표_백업_${todayStr}.json`;a.click()};
$('#bPub').onclick=()=>{
  if(!PUB)return toast('게시된 data.json을 찾을 수 없어요');
  if(!confirm('내 임시 수정본을 버리고 현재 게시된 내용으로 되돌릴까요?'))return;
  LOCAL=null;try{localStorage.removeItem(KEY)}catch(e){}
  close('#mSet');pick();init();pubBar();toast('게시본으로 되돌렸어요');
};
$('#bImp').onclick=()=>$('#bFile').click();
$('#bFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.staff||!x.shifts)throw 0;
    if(!confirm('현재 데이터를 모두 이 백업으로 바꿀까요?'))return;D=x;save();close('#mSet');init();toast('불러왔어요')}catch(_){toast('올바른 백업 파일이 아니에요')}};
  r.readAsText(f);e.target.value='';
};

function init(){
  setTitle();renderStaff();renderCal();renderLeave();
}
/* 시작: 게시된 data.json을 읽어옵니다 (없으면 이 브라우저의 임시 저장본/빈 데이터) */
(async()=>{
  try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok)PUB=await r.json()}catch(e){}
  pick();$$('.admin').forEach(e=>e.classList.add('hide'));init();
})();
</script>
</body>
</html>
